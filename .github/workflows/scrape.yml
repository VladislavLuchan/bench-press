name: Scrape

on:
  schedule:
    # Hourly: GitHub drops many scheduled runs, so real gaps are longer. Sources that must
    # not be fetched that often have a minimum interval in apps/scraper/src/config.ts.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch and filter only; no database, LLM or Telegram'
        type: boolean
        default: false
      backfill:
        description: 'Widen date windows to 7 days (first run / catch-up)'
        type: boolean
        default: false
      rescore:
        description: 'Re-evaluate open jobs under the current rules instead of fetching'
        type: boolean
        default: false
      rescore_location_type:
        description: 'Rescore only jobs with this location_type (empty = all)'
        type: string
        default: ''

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run scraper
        run: npm run scrape -w @bench-press/scraper -- ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.rescore && '--rescore' || '' }}
        env:
          BACKFILL: ${{ inputs.backfill && '1' || '' }}
          RESCORE_LOCATION_TYPE: ${{ inputs.rescore_location_type }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          # Optional residential proxy. Node's fetch honours HTTPS_PROXY when this flag is set.
          NODE_USE_ENV_PROXY: ${{ secrets.PROXY_URL != '' && '1' || '' }}
          HTTPS_PROXY: ${{ secrets.PROXY_URL }}
