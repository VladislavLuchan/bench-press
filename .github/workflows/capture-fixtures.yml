# Refreshes the saved HTML/XML pages that parser tests run against. Trigger it when a
# board changes its markup, then fix the parser until CI is green again.
name: Capture fixtures

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run scrape -w @bench-press/scraper -- --capture-fixtures
        env:
          NODE_USE_ENV_PROXY: ${{ secrets.PROXY_URL != '' && '1' || '' }}
          HTTPS_PROXY: ${{ secrets.PROXY_URL }}
      - name: Commit fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/scraper/tests/fixtures
          git diff --cached --quiet && echo "Fixtures unchanged" && exit 0
          git commit -m "test: refresh source fixtures"
          git push
